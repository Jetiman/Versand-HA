add_tracking_number:
  name: Sendungsnummer hinzufügen
  description: >-
    Fügt eine Sendungsnummer zur Paketverfolgung hinzu, falls sie noch nicht
    verfolgt wird. Der Anbieter (DHL oder DPD) wird automatisch erkannt.
  fields:
    tracking_number:
      name: Sendungsnummer
      description: Die Sendungs-/Trackingnummer (DHL oder DPD).
      required: true
      example: "00340434123456789012"
      selector:
        text:

remove_tracking_number:
  name: Sendungsnummer entfernen
  description: >-
    Entfernt eine Sendungsnummer aus der Paketverfolgung.
  fields:
    tracking_number:
      name: Sendungsnummer
      description: Die zu entfernende Sendungs-/Trackingnummer.
      required: true
      example: "00340434123456789012"
      selector:
        text:
