add_tracking_number:
  name: Sendungsnummer hinzufügen
  description: >-
    Fügt eine Sendungsnummer zur Paketverfolgung hinzu, falls sie noch nicht
    verfolgt wird. Der Anbieter (DHL, DPD oder Hermes) wird automatisch erkannt.
  fields:
    tracking_number:
      name: Sendungsnummer
      description: Die Sendungs-/Trackingnummer (DHL, DPD oder Hermes).
      required: true
      example: "00340434123456789012"
      selector:
        text:

remove_tracking_number:
  name: Sendungsnummer entfernen
  description: >-
    Entfernt eine Sendungsnummer aus der Paketverfolgung.
  fields:
    tracking_number:
      name: Sendungsnummer
      description: Die zu entfernende Sendungs-/Trackingnummer.
      required: true
      example: "00340434123456789012"
      selector:
        text:

set_tracking_carrier:
  name: Anbieter festlegen
  description: >-
    Ordnet eine Sendungsnummer fest einem Anbieter zu, falls die
    automatische Erkennung daneben liegt. "auto" hebt die Zuordnung
    wieder auf.
  fields:
    tracking_number:
      name: Sendungsnummer
      description: Die Sendungs-/Trackingnummer.
      required: true
      example: "H1003660752960401006"
      selector:
        text:
    carrier:
      name: Anbieter
      description: dhl, dpd, hermes oder auto.
      required: true
      example: hermes
      selector:
        select:
          options:
            - dhl
            - dpd
            - hermes
            - auto

set_tracking_direction:
  name: Richtung festlegen
  description: >-
    Legt fest, ob eine Sendung von dir gesendet oder empfangen wird
    ("Richtung" im Panel). Nötig, weil die anonyme Sendungsverfolgung das
    nicht wissen kann - DHL meldet immer "ankommend". "auto" hebt die
    Zuordnung wieder auf.
  fields:
    tracking_number:
      name: Sendungsnummer
      description: Die Sendungs-/Trackingnummer (bei Amazon die Bestellnummer).
      required: true
      example: "357566057330"
      selector:
        text:
    direction:
      name: Richtung
      description: send (gesendet), receive (empfangen) oder auto.
      required: true
      example: send
      selector:
        select:
          options:
            - send
            - receive
            - auto

set_tracking_name:
  name: Name festlegen
  description: >-
    Gibt einer Sendung einen eigenen Namen (Label). Leer lassen, um den
    Namen wieder zu entfernen.
  fields:
    tracking_number:
      name: Sendungsnummer
      description: Die Sendungs-/Trackingnummer.
      required: true
      example: "00340434123456789012"
      selector:
        text:
    name:
      name: Name
      description: Der anzuzeigende Name (leer = zurücksetzen).
      required: false
      example: Kopfhörer Amazon
      selector:
        text:

set_notifications:
  name: Benachrichtigungen einstellen
  description: >-
    Schaltet die Benachrichtigungen bei neuer Sendung / Statusänderung an
    oder aus und legt die Ziele fest (notify.*-Dienste). Gilt für alle
    Einträge. Wird auch von der Oberfläche verwendet.
  fields:
    enabled:
      name: Aktiviert
      description: Benachrichtigungen an/aus.
      required: false
      default: true
      selector:
        boolean:
    targets:
      name: Ziele
      description: notify.*-Dienste, an die gesendet wird (z. B. mobile_app_galaxy_s22).
      required: false
      example: ["mobile_app_galaxy_s22"]
      selector:
        select:
          multiple: true
          custom_value: true
          options: []
    out_for_delivery_only:
      name: Nur bei „In Zustellung"
      description: >-
        Wenn an, wird nur benachrichtigt, sobald eine Sendung in Zustellung
        geht oder zugestellt wird – keine Meldung bei Zwischenschritten.
      required: false
      default: false
      selector:
        boolean:
